<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusForge Tracker</title>
  <meta name="description" content="Pomodoro tracker with local analytics.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>FocusForge Tracker</h1>
      <p>Run focused sessions and track your consistency locally.</p>

      <div class="timer-wrap">
        <label class="label" for="minutes">Session Minutes</label>
        <input id="minutes" type="number" min="1" max="90" value="25">
        <p id="mode" class="mode">Mode: focus</p>
        <p id="timer" class="timer">25:00</p>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div class="actions">
        <button id="start" type="button">Start</button>
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <button id="complete" type="button">Complete Session</button>
        <button id="next" type="button">Next Interval</button>
      </div>
      <label class="check"><input id="notes" type="checkbox"> Pop up a note when time's up</label>
      <p id="status" class="status" aria-live="polite"></p>
      <p class="hint">Shortcuts: `Space` start/pause, `R` reset, `Enter` complete, `N` next interval.</p>
    </section>

    <section class="panel">
      <h2>Analytics</h2>
      <ul id="stats" class="stats"></ul>
      <h3>Recent Sessions</h3>
      <ul id="history" class="stats"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
